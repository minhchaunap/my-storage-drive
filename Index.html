<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitCloud Drive - Lưu trữ Ảnh, Video & Office trên GitHub</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 to-indigo-700 flex items-center justify-center text-white shadow-md">
            <i data-lucide="folder-git-2" class="w-6 h-6"></i>
          </div>
          <div>
            <span class="font-bold text-lg text-slate-900 tracking-tight">GitCloud Drive</span>
            <p class="text-xs text-slate-500 hidden sm:block">Lưu trữ Ảnh, Video & Office qua GitHub</p>
          </div>
        </div>

        <div class="hidden md:flex flex-1 max-w-md mx-6">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="Tìm kiếm tệp..." 
                   class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 border border-transparent rounded-lg focus:bg-white focus:border-indigo-500 outline-none">
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <button id="btnOpenGitHubSettings" class="flex items-center space-x-2 text-xs font-medium px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 shadow-sm">
            <span id="githubStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="githubStatusText">minhchaunap/my-storage-drive</span>
            <i data-lucide="github" class="w-4 h-4 text-slate-700"></i>
          </button>
          <button id="btnUploadHeader" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg shadow-sm">
            <i data-lucide="upload-cloud" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Tải lên tệp</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="dropZone" class="mb-6 p-6 border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-white rounded-2xl text-center cursor-pointer">
      <input type="file" id="fileInput" multiple class="hidden" accept="image/*,video/*,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx">
      <div class="flex flex-col items-center justify-center space-y-2">
        <i data-lucide="upload-cloud" class="w-10 h-10 text-indigo-600"></i>
        <p class="text-sm font-semibold text-slate-800">Chạm để chọn hoặc kéo thả tệp vào đây</p>
        <p class="text-xs text-slate-500">Hỗ trợ: Ảnh, Video, Word (.docx), Excel (.xlsx), PowerPoint (.pptx)</p>
      </div>
    </div>

    <div class="flex items-center overflow-x-auto space-x-2 pb-2 mb-4" id="categoryTabs">
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white" data-category="all">Tất cả</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="image">Ảnh</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="video">Video</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="word">Word</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="excel">Excel</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="powerpoint">PowerPoint</button>
    </div>

    <div id="fileGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    const STATE = {
      files: [],
      currentCategory: 'all',
      searchQuery: '',
      githubConfig: { token: '', owner: 'minhchaunap', repo: 'my-storage-drive', branch: 'main', path: 'uploads/' }
    };

    function getFileCategory(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'image';
      if (['mp4','webm','mov'].includes(ext)) return 'video';
      if (['doc','docx'].includes(ext)) return 'word';
      if (['xls','xlsx','csv'].includes(ext)) return 'excel';
      if (['ppt','pptx'].includes(ext)) return 'powerpoint';
      return 'other';
    }

    function showToast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = (type === 'success' ? 'bg-emerald-600' : 'bg-slate-900') + ' text-white px-4 py-2 rounded-xl text-xs shadow-lg';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function renderFiles() {
      const list = STATE.files.filter(f => (STATE.currentCategory === 'all' || f.category === STATE.currentCategory));
      const grid = document.getElementById('fileGridContainer');
      grid.innerHTML = list.map(f => `
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
          <div class="font-medium text-xs text-slate-900 truncate mb-1">${f.name}</div>
          <div class="text-[11px] text-slate-400 mb-2">${(f.size/1024).toFixed(1)} KB</div>
          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold uppercase">${f.category}</span>
            <a href="${f.url}" download="${f.name}" class="text-xs text-indigo-600 font-semibold">Tải về</a>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function handleUpload(fileList) {
      Array.from(fileList).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const item = { name: file.name, category: getFileCategory(file.name), size: file.size, url: e.target.result };
          STATE.files.unshift(item);
          renderFiles();
          showToast('Đã thêm tệp: ' + file.name, 'success');
        };
        reader.readAsDataURL(file);
      });
    }

    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnUploadHeader').addEventListener('click', () => fileInput.click());
    document.getElementById('dropZone').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleUpload(e.target.files));

    document.querySelectorAll('.category-tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.category-tab').forEach(x => {
          x.className = 'category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200';
        });
        b.className = 'category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white';
        STATE.currentCategory = b.dataset.category;
        renderFiles();
      });
    });

    window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
</body>
</html>
