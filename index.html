<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitCloud Drive - Lưu trữ Ảnh, Video & Office trên GitHub</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 to-indigo-700 flex items-center justify-center text-white shadow-md">
            <i data-lucide="folder-git-2" class="w-6 h-6"></i>
          </div>
          <div>
            <span class="font-bold text-lg text-slate-900 tracking-tight">GitCloud Drive</span>
            <p class="text-xs text-slate-500 hidden sm:block">Lưu trữ Ảnh, Video, Word, Excel, PowerPoint</p>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Nút Tạo Thư Mục -->
          <button id="btnNewFolderHeader" class="flex items-center space-x-1.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs font-medium px-3 py-2 rounded-lg shadow-2xs transition">
            <i data-lucide="folder-plus" class="w-4 h-4 text-indigo-600"></i>
            <span class="hidden sm:inline">Tạo thư mục</span>
          </button>

          <!-- Nút Tải lên -->
          <button id="btnUploadHeader" class="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-2 rounded-lg shadow-sm transition">
            <i data-lucide="upload-cloud" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Tải lên tệp</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Thanh Điều Hướng Thư Mục (Breadcrumb) -->
    <div class="flex items-center justify-between bg-white px-4 py-2.5 rounded-xl border border-slate-200 mb-4 shadow-2xs">
      <div class="flex items-center space-x-2 text-xs overflow-x-auto" id="breadcrumbContainer"></div>
      <button id="btnNewFolderInline" class="flex items-center space-x-1 text-xs text-indigo-600 hover:text-indigo-800 font-semibold px-2 py-1 rounded hover:bg-indigo-50 transition">
        <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
        <span>Thư mục mới</span>
      </button>
    </div>

    <!-- Danh Sách Thư Mục (Folder Grid) -->
    <div id="folderSection" class="mb-4">
      <div id="folderGridContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
    </div>

    <!-- Drag & Drop Upload Zone -->
    <div id="dropZone" class="mb-6 p-5 border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-white rounded-2xl text-center cursor-pointer">
      <input type="file" id="fileInput" multiple class="hidden" accept="image/*,video/*,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx">
      <div class="flex flex-col items-center justify-center space-y-1.5">
        <i data-lucide="upload-cloud" class="w-8 h-8 text-indigo-600"></i>
        <p class="text-xs font-semibold text-slate-800">Bấm hoặc kéo thả Ảnh, Video, Word, Excel, PowerPoint vào đây</p>
      </div>
    </div>

    <!-- Bộ Lọc Danh Mục -->
    <div class="flex items-center overflow-x-auto space-x-1.5 pb-2 mb-4" id="categoryTabs">
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white" data-category="all">Tất cả</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="image">Ảnh</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="video">Video</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="word">Word</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="excel">Excel</button>
      <button class="category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200" data-category="powerpoint">PowerPoint</button>
    </div>

    <!-- Lưới File -->
    <div id="fileGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <!-- Modal Tạo Thư Mục -->
  <div id="folderModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-sm font-bold text-slate-900">Tạo thư mục mới</h3>
        <button id="btnCloseFolderModal" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Tên thư mục:</label>
        <input type="text" id="folderNameInput" placeholder="Ví dụ: Tài liệu hợp đồng, Ảnh 2026..." class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-lg outline-none focus:border-indigo-500">
      </div>
      <div class="mt-5 flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
        <button id="btnCancelFolder" class="px-3 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-xs font-semibold">Huỷ</button>
        <button id="btnSaveFolder" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Tạo thư mục</button>
      </div>
    </div>
  </div>

  <!-- Modal Đổi Tên (File & Folder) -->
  <div id="renameModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 id="renameModalTitle" class="text-sm font-bold text-slate-900">Đổi tên</h3>
        <button id="btnCloseRenameModal" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div>
        <label id="renameInputLabel" class="block text-xs font-semibold text-slate-700 mb-1">Tên mới:</label>
        <input type="text" id="renameInput" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-lg outline-none focus:border-indigo-500">
      </div>
      <div class="mt-5 flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
        <button id="btnCancelRename" class="px-3 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-xs font-semibold">Huỷ</button>
        <button id="btnSaveRename" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Lưu tên mới</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    const STATE = {
      folders: [
        { id: 'folder-root', name: 'Trang chủ', parentId: null },
        { id: 'folder-media', name: 'Ảnh & Video', parentId: 'folder-root' },
        { id: 'folder-docs', name: 'Tài liệu Office', parentId: 'folder-root' }
      ],
      currentFolderId: 'folder-root',
      files: [],
      currentCategory: 'all',
      renameTarget: null
    };

    function getFileCategory(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'image';
      if (['mp4','webm','mov'].includes(ext)) return 'video';
      if (['doc','docx'].includes(ext)) return 'word';
      if (['xls','xlsx','csv'].includes(ext)) return 'excel';
      if (['ppt','pptx'].includes(ext)) return 'powerpoint';
      return 'other';
    }

    function showToast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = (type === 'success' ? 'bg-emerald-600' : 'bg-slate-900') + ' text-white px-4 py-2 rounded-xl text-xs shadow-lg transition';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    function loadState() {
      try {
        const sf = localStorage.getItem('gitcloud_folders');
        if (sf) STATE.folders = JSON.parse(sf);
        const sfiles = localStorage.getItem('gitcloud_files');
        if (sfiles) STATE.files = JSON.parse(sfiles);
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem('gitcloud_folders', JSON.stringify(STATE.folders));
        localStorage.setItem('gitcloud_files', JSON.stringify(STATE.files));
      } catch (e) {}
    }

    function renderBreadcrumb() {
      const container = document.getElementById('breadcrumbContainer');
      const cur = STATE.folders.find(f => f.id === STATE.currentFolderId) || STATE.folders[0];
      let crumbs = [];
      let c = cur;
      while (c) {
        crumbs.unshift(c);
        if (!c.parentId) break;
        c = STATE.folders.find(f => f.id === c.parentId);
      }
      container.innerHTML = crumbs.map((item, idx) => {
        if (idx === crumbs.length - 1) {
          return `<span class="font-bold text-slate-800 flex items-center"><i data-lucide="folder-open" class="w-3.5 h-3.5 mr-1 text-indigo-600"></i>${item.name}</span>`;
        }
        return `<button class="text-slate-500 hover:text-indigo-600 font-medium" data-nav="${item.id}">${item.name}</button><span class="text-slate-300">/</span>`;
      }).join('');
    }

    function renderFolders() {
      const grid = document.getElementById('folderGridContainer');
      const subs = STATE.folders.filter(f => f.parentId === STATE.currentFolderId);
      if (subs.length === 0) {
        document.getElementById('folderSection').classList.add('hidden');
        grid.innerHTML = '';
        return;
      }
      document.getElementById('folderSection').classList.remove('hidden');
      grid.innerHTML = subs.map(f => {
        const count = STATE.files.filter(file => file.folderId === f.id).length;
        return `
          <div class="bg-white p-3 rounded-xl border border-slate-200 hover:border-indigo-400 hover:shadow-md transition flex flex-col justify-between group cursor-pointer" data-folder-card="${f.id}">
            <div class="flex items-start justify-between mb-2">
              <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg"><i data-lucide="folder" class="w-5 h-5"></i></div>
              <div class="flex items-center space-x-1" onclick="event.stopPropagation()">
                <button class="p-1 text-slate-400 hover:text-indigo-600" data-action="rename-folder" data-id="${f.id}" title="Đổi tên"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                <button class="p-1 text-slate-400 hover:text-rose-600" data-action="delete-folder" data-id="${f.id}" title="Xoá"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>
            <div>
              <div class="font-bold text-xs text-slate-800 truncate">${f.name}</div>
              <div class="text-[10px] text-slate-400">${count} tệp tin</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderFiles() {
      renderBreadcrumb();
      renderFolders();
      const list = STATE.files.filter(f => {
        const matchFolder = (f.folderId === STATE.currentFolderId || (!f.folderId && STATE.currentFolderId === 'folder-root'));
        const matchCat = (STATE.currentCategory === 'all' || f.category === STATE.currentCategory);
        return matchFolder && matchCat;
      });

      const grid = document.getElementById('fileGridContainer');
      grid.innerHTML = list.map(f => `
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="font-semibold text-xs text-slate-900 truncate mb-1">${f.name}</div>
            <div class="text-[11px] text-slate-400 mb-2">${(f.size/1024).toFixed(1)} KB</div>
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 font-semibold uppercase">${f.category}</span>
            <div class="flex items-center space-x-1">
              <button class="p-1 text-slate-400 hover:text-amber-600" data-action="rename-file" data-id="${f.id}" title="Đổi tên"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
              <a href="${f.url}" download="${f.name}" class="p-1 text-slate-400 hover:text-emerald-600" title="Tải về"><i data-lucide="download" class="w-3.5 h-3.5"></i></a>
              <button class="p-1 text-slate-400 hover:text-rose-600" data-action="delete-file" data-id="${f.id}" title="Xoá"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openRenameModal(type, id) {
      STATE.renameTarget = { type, id };
      const input = document.getElementById('renameInput');
      if (type === 'file') {
        const item = STATE.files.find(x => x.id === id);
        if (item) input.value = item.name;
      } else {
        const folder = STATE.folders.find(x => x.id === id);
        if (folder) input.value = folder.name;
      }
      document.getElementById('renameModal').classList.remove('hidden');
    }

    function saveRename() {
      const val = document.getElementById('renameInput').value.trim();
      if (!val) return;
      if (STATE.renameTarget.type === 'file') {
        const item = STATE.files.find(x => x.id === STATE.renameTarget.id);
        if (item) { item.name = val; item.category = getFileCategory(val); }
      } else {
        const f = STATE.folders.find(x => x.id === STATE.renameTarget.id);
        if (f) f.name = val;
      }
      saveState();
      renderFiles();
      document.getElementById('renameModal').classList.add('hidden');
      showToast('Đã đổi tên thành công!', 'success');
    }

    function saveFolder() {
      const name = document.getElementById('folderNameInput').value.trim();
      if (!name) return;
      STATE.folders.push({ id: 'folder-' + Date.now(), name: name, parentId: STATE.currentFolderId });
      saveState();
      renderFiles();
      document.getElementById('folderModal').classList.add('hidden');
      showToast('Đã tạo thư mục: ' + name, 'success');
    }

    // Events
    document.getElementById('btnNewFolderHeader').addEventListener('click', () => { document.getElementById('folderNameInput').value = ''; document.getElementById('folderModal').classList.remove('hidden'); });
    document.getElementById('btnNewFolderInline').addEventListener('click', () => { document.getElementById('folderNameInput').value = ''; document.getElementById('folderModal').classList.remove('hidden'); });
    document.getElementById('btnCloseFolderModal').addEventListener('click', () => document.getElementById('folderModal').classList.add('hidden'));
    document.getElementById('btnCancelFolder').addEventListener('click', () => document.getElementById('folderModal').classList.add('hidden'));
    document.getElementById('btnSaveFolder').addEventListener('click', saveFolder);

    document.getElementById('btnCloseRenameModal').addEventListener('click', () => document.getElementById('renameModal').classList.add('hidden'));
    document.getElementById('btnCancelRename').addEventListener('click', () => document.getElementById('renameModal').classList.add('hidden'));
    document.getElementById('btnSaveRename').addEventListener('click', saveRename);

    document.getElementById('breadcrumbContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-nav]');
      if (btn) { STATE.currentFolderId = btn.dataset.nav; renderFiles(); }
    });

    document.getElementById('folderGridContainer').addEventListener('click', (e) => {
      const rename = e.target.closest('[data-action="rename-folder"]');
      if (rename) { openRenameModal('folder', rename.dataset.id); return; }
      const del = e.target.closest('[data-action="delete-folder"]');
      if (del) {
        STATE.folders = STATE.folders.filter(x => x.id !== del.dataset.id);
        saveState(); renderFiles(); showToast('Đã xoá thư mục', 'info'); return;
      }
      const card = e.target.closest('[data-folder-card]');
      if (card) { STATE.currentFolderId = card.dataset.folderCard; renderFiles(); }
    });

    document.getElementById('fileGridContainer').addEventListener('click', (e) => {
      const rename = e.target.closest('[data-action="rename-file"]');
      if (rename) { openRenameModal('file', rename.dataset.id); return; }
      const del = e.target.closest('[data-action="delete-file"]');
      if (del) {
        STATE.files = STATE.files.filter(x => x.id !== del.dataset.id);
        saveState(); renderFiles(); showToast('Đã xoá tệp tin', 'info'); return;
      }
    });

    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnUploadHeader').addEventListener('click', () => fileInput.click());
    document.getElementById('dropZone').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          STATE.files.unshift({ id: 'file-' + Date.now(), folderId: STATE.currentFolderId, name: file.name, category: getFileCategory(file.name), size: file.size, url: ev.target.result });
          saveState(); renderFiles(); showToast('Đã tải lên: ' + file.name, 'success');
        };
        reader.readAsDataURL(file);
      });
    });

    document.querySelectorAll('.category-tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.category-tab').forEach(x => x.className = 'category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200');
        b.className = 'category-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white';
        STATE.currentCategory = b.dataset.category;
        renderFiles();
      });
    });

    window.addEventListener('DOMContentLoaded', () => { loadState(); renderFiles(); });
  </script>
</body>
</html>
